server:
  port: ${PORT:8082}

spring:
  application:
    name: patient-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/hospital}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${POSTGRES_POOL_SIZE:10}
      minimum-idle: ${POSTGRES_MIN_POOL_SIZE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    schemas: ${POSTGRES_SCHEMA:public}
    default-schema: ${POSTGRES_SCHEMA:public}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:public}
        format_sql: true
        jdbc:
          batch_size: ${POSTGRES_BATCH_SIZE:100}
          fetch_size: ${POSTGRES_FETCH_SIZE:100}
        order_inserts: true
        order_updates: true
    show-sql: false